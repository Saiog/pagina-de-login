<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Logim</title>
</head>
<body>
    <h1>Logim</h1>
    <form>
        <label for="usuario">Usuário:</label>
        <input type="text" id="usuario" name="usuario">
        <br>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha">
        <br>
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
